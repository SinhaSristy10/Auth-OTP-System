<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAuth | Email OTP Verification</title>
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background glowing ambient lights -->
    <div class="glow-bg top-left"></div>
    <div class="glow-bg bottom-right"></div>

    <div class="main-container">

        <!-- ================= AUTH CONTAINER (SIGNUP & LOGIN) ================= -->
        <div id="authContainer" class="glass-card">
            <div class="card-header">
                <div class="logo-badge">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <h2>SecureAuth</h2>
                <p>Simple & Secure Authentication with Email OTP</p>
            </div>

            <!-- Tabs: Login / Sign Up -->
            <div class="tab-switcher">
                <button id="tabRegister" class="tab-btn active" onclick="switchTab('register')">Sign Up</button>
                <button id="tabLogin" class="tab-btn" onclick="switchTab('login')">Log In</button>
            </div>

            <!-- Toast Notification Box -->
            <div id="toastMessage" class="toast hidden"></div>

            <!-- SIGN UP FORM -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="John Doe" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="john@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
                </div>
                <button type="submit" id="btnRegister" class="primary-btn">
                    <span>Create Account & Send OTP</span>
                </button>
            </form>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="auth-form hidden" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="john@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" id="btnLogin" class="primary-btn">
                    <span>Log In to Dashboard</span>
                </button>
            </form>
        </div>

        <!-- ================= OTP VERIFICATION MODAL ================= -->
        <div id="otpModal" class="modal-overlay hidden">
            <div class="glass-card modal-content">
                <div class="modal-header">
                    <div class="mail-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                    <h3>Verify Your Email</h3>
                    <p>Enter the 6-digit code sent to<br><strong id="displayEmail">user@example.com</strong></p>
                </div>

                <!-- 6 Digit OTP Inputs -->
                <div class="otp-inputs" id="otpGroup">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric" autofocus>
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
                </div>

                <button id="btnVerify" class="primary-btn" onclick="handleVerifyOTP()">
                    <span>Verify & Activate</span>
                </button>

                <div class="resend-container">
                    <span id="timerText">Resend OTP in <b id="countdown">60</b>s</span>
                    <button id="btnResend" class="link-btn hidden" onclick="handleResendOTP()">Resend OTP</button>
                </div>
            </div>
        </div>

        <!-- ================= LOGGED IN DASHBOARD ================= -->
        <div id="dashboardContainer" class="glass-card hidden">
            <div class="dashboard-header">
                <div class="avatar" id="dashAvatar">U</div>
                <h2 id="dashWelcome">Welcome, User!</h2>
                <div class="verified-pill">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    <span>Email Verified</span>
                </div>
            </div>

            <div class="dashboard-body">
                <div class="info-row">
                    <span>Email:</span>
                    <strong id="dashEmail">email@domain.com</strong>
                </div>
                <div class="info-row">
                    <span>Account Status:</span>
                    <span class="badge active">Active & Secure</span>
                </div>
                <div class="info-row">
                    <span>Token Session:</span>
                    <span class="badge">Valid for 2 Hours</span>
                </div>
            </div>

            <button class="logout-btn" onclick="handleLogout()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Log Out</span>
            </button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
